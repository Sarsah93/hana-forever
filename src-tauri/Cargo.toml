[package]
name = "hana-forever"
version = "0.1.0"
description = "Hana, an always-present desktop companion"
authors = ["Hana's family"]
edition = "2021"

[lib]
name = "hana_forever_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
