name: release

# Tag a commit to publish a test build other people can install:
#   git tag v0.1.0-test1 && git push origin v0.1.0-test1
# The installer lands on the Releases page as a public download link.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build

      - name: Publish installer
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Hana Forever ${{ github.ref_name }}
          body: |
            하나 시메지 테스트 빌드입니다.

            ## 설치
            1. 아래 `Hana.Forever_*_x64-setup.exe`를 내려받아 실행합니다.
            2. 관리자 권한은 필요 없습니다 (현재 사용자에게만 설치).
            3. WebView2가 없는 PC라면 설치 중 자동으로 함께 설치됩니다.

            ## 사용
            - 하나를 드래그하면 옮길 수 있습니다.
            - **F2**로 행동 패널을 여닫습니다.
            - 트레이 아이콘 우클릭으로 패널 열기, 화면 중앙으로 데려오기, **종료**를 할 수 있습니다.

            ## 참고
            현재 스프라이트가 등록된 동작은 `idle-stand`와 `stand-up` 두 가지입니다.
            나머지 동작을 고르면 자리표시자(🐩)가 표시됩니다.
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
